services:
  # S3-compatible object storage
  rustfs:
    image: rustfs/rustfs:latest
    container_name: cv-rustfs
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    networks:
      - cv-network

  # Main API mock
  fastapi:
    image: python:3.12-slim-bookworm
    container_name: cv-fastapi
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
      uvicorn app:app --host 0.0.0.0 --port 8000"
    environment:
      SERVICE_NAME: fastapi
      CV_SERVICE_URL: http://cv-service:8001
      DATABASE_URL: sqlite:////data/cv_database.db
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: cv-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./mock:/app
      - sqlite_data:/data
    depends_on:
      - rustfs
    networks:
      - cv-network

  # Computer Vision mock
  cv-service:
    image: python:3.12-slim-bookworm
    container_name: cv-service
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
      uvicorn app:app --host 0.0.0.0 --port 8001"
    environment:
      SERVICE_NAME: cv-service
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: cv-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8001:8001"
    volumes:
      - ./mock:/app
    depends_on:
      - rustfs
    networks:
      - cv-network

volumes:
  s3_data:
  sqlite_data:

networks:
  cv-network:
    driver: bridge

